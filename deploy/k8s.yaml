apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrgen
  labels: { app: qrgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: qrgen }
  template:
    metadata:
      labels: { app: qrgen }
    spec:
      containers:
        - name: qrgen
          image: qrgen:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: qrgen
spec:
  selector: { app: qrgen }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qrgen
spec:
  rules:
    - host: qrgen.homelab.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: qrgen, port: { number: 80 } }
