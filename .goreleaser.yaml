# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: qrgen

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: qrgen
    main: ./cmd/qrgen
    binary: qrgen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - deploy/*

dockers_v2:
  - ids: [qrgen]
    dockerfile: Dockerfile.goreleaser
    images: ["ghcr.io/goulashBrain/qrgen"]      # lowercase GitHub username
    tags: ["{{ .Version }}", "latest"]
    platforms: [linux/amd64, linux/arm64]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).